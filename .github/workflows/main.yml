name: CI/CD - Node.js Application with Docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Node.js Tests
    runs-on: ubuntu-latest

    services:
      mysqldb:
        image: mysql:lts
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: rodkexpressapp:latest
          platforms: linux/amd64
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Run tests inside container
        run: |
          docker run --rm \
            --network host \
            -e NODE_ENV=test \
            -e dbport=3306 \
            -e dbpwd=${{ secrets.MYSQL_PASSWORD }} \
            -e dbuser=${{ secrets.MYSQL_USER }} \
            -e dbname=${{ secrets.MYSQL_DATABASE }} \
            -e dbhost=localhost \
            rodkexpressapp:latest
        env:
          CI: true
        timeout-minutes: 10

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Extract metadata
        id: meta
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          NVERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$NVERSION" >> "$GITHUB_OUTPUT"
      - name: Determine Docker Tags
        id: docker_tags
        run: |
          # Always tag with latest and the short commit SHA
          TAGS="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest,${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}"
          
          # Check if this run was triggered by a Git tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            GIT_TAG=${GITHUB_REF#refs/tags/}
            PKG_VERSION="${{ steps.meta.outputs.version }}"
            
            # Only add the version tag if it matches package.json (with or without 'v')
            if [ "$GIT_TAG" = "$PKG_VERSION" ] || [ "$GIT_TAG" = "v$PKG_VERSION" ]; then
              TAGS="$TAGS,${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:$PKG_VERSION"
            else
              echo "Warning: Git tag ($GIT_TAG) does not match package.json ($PKG_VERSION). Skipping version tag."
            fi
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
